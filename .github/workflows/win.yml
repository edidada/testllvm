# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on win

on:
  push:
    branches: [ "multiple" ]
  pull_request:
    branches: [ "multiple" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        build_type: [Release, Debug]
        c_compiler: [cl]
        include:
          - os: windows-2022
            c_compiler: cl
            cpp_compiler: cl
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    # The LLVM 18.1.8 Windows export targets reference diaguids.lib by an
    # absolute VS2019 DIA SDK path. VS lives in different folders on the two
    # runner images, so locate the lib and copy it to the expected path.
    - name: Prepare DIA SDK path
      shell: pwsh
      run: |
        $dest = 'C:\Program Files (x86)\Microsoft Visual Studio\2019\Professional\DIA SDK\lib\amd64'
        $candidates = @()
        $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
        if (Test-Path -LiteralPath $vswhere) {
          foreach ($root in (& $vswhere -latest -products * -property installationPath)) {
            $candidates += (Join-Path $root 'DIA SDK\lib\amd64\diaguids.lib')
          }
        }
        $candidates += @(
          'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\DIA SDK\lib\amd64\diaguids.lib',
          'C:\Program Files\Microsoft Visual Studio\2022\Professional\DIA SDK\lib\amd64\diaguids.lib',
          'C:\Program Files\Microsoft Visual Studio\2022\Community\DIA SDK\lib\amd64\diaguids.lib'
        )
        $src = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
        if (-not $src) {
          $found = Get-ChildItem -Path 'C:\Program Files\Microsoft Visual Studio', 'C:\Program Files (x86)\Microsoft Visual Studio' -Filter diaguids.lib -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) { $src = $found.FullName }
        }
        if ($src) {
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -LiteralPath $src -Destination (Join-Path $dest 'diaguids.lib') -Force
          Write-Host "diaguids.lib provisioned from $src"
        } else {
          Write-Host '::warning::diaguids.lib not found on this runner image'
        }
        $global:LASTEXITCODE = 0

    - name: Install tools via Chocolatey
      run: |
        choco install wget 7zip -y --force

    - name: Download LLVM
      run: |
        wget https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-pc-windows-msvc.tar.xz -O llvm.tar.xz

    - name: Extract LLVM to C:\LLVM
      run: |
        7z x llvm.tar.xz -oC:\LLVM -y
        cd "C:\LLVM"
        dir
        7z x llvm.tar -oC:\LLVM
        dir
        cd clang+llvm-18.1.8-x86_64-pc-windows-msvc
        dir

    - name: Set environment variables
      run: |
        echo "LLVM_PREFIX=C:\LLVM\clang+llvm-18.1.8-x86_64-pc-windows-msvc" >> $env:GITHUB_ENV
        echo "PATH=C:\LLVM\clang+llvm-18.1.8-x86_64-pc-windows-msvc\bin;$env:PATH" >> $env:GITHUB_ENV

    - name: Verify installation
      run: |
        llvm-config --version
        dir C:\LLVM\clang+llvm-18.1.8-x86_64-pc-windows-msvc\bin\llvm-config.exe

    # The prebuilt LLVM Windows libs are Release /MD with _ITERATOR_DEBUG_LEVEL=0.
    # Debug configs must match that ABI or the linker reports LNK2038.
    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
        -DCMAKE_CXX_FLAGS="/D_ITERATOR_DEBUG_LEVEL=0"
        -DCMAKE_CXX_FLAGS_DEBUG="/MD /Zi /Ob0 /Od"
        -DCMAKE_C_FLAGS_DEBUG="/MD /Zi /Ob0 /Od"
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}
