# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on win

on:
  push:
    branches: [ "multiple" ]
  pull_request:
    branches: [ "multiple" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        build_type: [Release, Debug]
        c_compiler: [cl]
        include:
          - os: windows-2022
            c_compiler: cl
            cpp_compiler: cl
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    # Best effort: some LLVM builds look for the DIA SDK at the VS2019 path.
    # Create its parent directory first, and never fail the job if the link
    # cannot be created (CMakeLists.txt also probes the VS2022 path directly).
    - name: Prepare DIA SDK path
      shell: pwsh
      run: |
        $target = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\DIA SDK'
        $link = 'C:\Program Files (x86)\Microsoft Visual Studio\2019\Professional\DIA SDK'
        if (Test-Path -LiteralPath $target) {
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $link) | Out-Null
          if (-not (Test-Path -LiteralPath $link)) {
            try {
              New-Item -ItemType SymbolicLink -Path $link -Target $target -ErrorAction Stop | Out-Null
              Write-Host 'DIA SDK symlink created'
            } catch {
              Write-Host "DIA SDK symlink skipped: $($_.Exception.Message)"
            }
          }
        } else {
          Write-Host 'VS2022 DIA SDK not found, skipping symlink'
        }

    - name: Install tools via Chocolatey
      run: |
        choco install wget 7zip -y --force

    - name: Download LLVM
      run: |
        wget https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-pc-windows-msvc.tar.xz -O llvm.tar.xz

    - name: Extract LLVM to C:\LLVM
      run: |
        7z x llvm.tar.xz -oC:\LLVM -y
        cd "C:\LLVM"
        dir
        7z x llvm.tar -oC:\LLVM
        dir
        cd clang+llvm-18.1.8-x86_64-pc-windows-msvc
        dir

    - name: Set environment variables
      run: |
        echo "LLVM_PREFIX=C:\LLVM\clang+llvm-18.1.8-x86_64-pc-windows-msvc" >> $env:GITHUB_ENV
        echo "PATH=C:\LLVM\clang+llvm-18.1.8-x86_64-pc-windows-msvc\bin;$env:PATH" >> $env:GITHUB_ENV

    - name: Verify installation
      run: |
        llvm-config --version
        dir C:\LLVM\clang+llvm-18.1.8-x86_64-pc-windows-msvc\bin\llvm-config.exe

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}
