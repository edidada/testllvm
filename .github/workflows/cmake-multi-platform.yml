# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "multiple" ]
  pull_request:
    branches: [ "multiple" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release, Debug]
        c_compiler: [gcc, clang, cl]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
        exclude:
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: linux install deps
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install llvm libclang-dev -y

    - name: macos install deps
      if: runner.os == 'macOS'
      run: |
        brew update
        brew search llvm
        brew install llvm@18
        brew --prefix llvm@18

    - name: Set up LLVM environment
      if: runner.os == 'macOS'
      run: |
        LLVM_PREFIX=$(brew --prefix llvm@18)
        echo "CXXFLAGS=-stdlib=libstdc++" >> $GITHUB_ENV
        echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
        echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV
        echo "LLVM_DIR=$LLVM_PREFIX/lib/cmake/llvm" >> $GITHUB_ENV
        echo "PATH=$LLVM_PREFIX/bin:$PATH" >> $GITHUB_ENV
        echo "LDFLAGS=-L$LLVM_PREFIX/lib -Wl,-rpath,$LLVM_PREFIX/lib" >> $GITHUB_ENV
        echo "CPPFLAGS=-I$LLVM_PREFIX/include" >> $GITHUB_ENV
        echo "LLVM_PREFIX: $LLVM_PREFIX"
        echo "CC: $CC"
        echo "CXX: $CXX"
        echo "LLVM_DIR: $LLVM_DIR"

    - name: win vcpkg install deps
      if: runner.os == 'Windows'
      run: |
#        vcpkg install llvm:x64-windows


    - name: Install 7-Zip (for tar.xz extraction)
      uses: burnsra/psaction-install-7zip@v1.1
      if: runner.os == 'Windows'

    - name: Install LLVM via Chocolatey
      if: runner.os == 'Windows'
      run: |
#        choco search llvm --all-versions -r
#        choco info llvm
#        choco install llvm -y --version=18.1.8 --force
#        echo "验证Chocolatey安装"
#        choco list | findstr llvm
#        echo "LLVM_DIR=C:\Program Files\LLVM\lib\cmake\llvm" >> $env:GITHUB_ENV
#        echo "PATH=C:\Program Files\LLVM\bin;$env:PATH" >> $env:GITHUB_ENV
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-pc-windows-msvc.tar.xz"
          $downloadPath = "$env:RUNNER_TEMP\llvm.tar.xz"
          Invoke-WebRequest -Uri $llvmUrl -OutFile $downloadPath
          echo "LLVM downloaded to $downloadPath"
          $downloadPath = "$env:RUNNER_TEMP\llvm.tar.xz"
          $extractPath = "$env:RUNNER_TEMP\llvm"
          7z x $downloadPath -o"$extractPath" -y
          echo "LLVM extracted to $extractPath"
          $llvmPath = "$env:RUNNER_TEMP\llvm\clang+llvm-18.1.8-x86_64-pc-windows-msvc"
          echo "LLVM_PATH=$llvmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "Path=$llvmPath\bin;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "Added LLVM to PATH: $llvmPath\bin"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}
